name: Notify mod page

# Called from a mod repo on push to master. Asks darkbordermanmodding.github.io to re-sync this repo's entry.
on:
  workflow_call:
    secrets:
      PAGES_DISPATCH_TOKEN:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          REPO: ${{ github.event.repository.name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          gh api repos/DarkbordermanModding/darkbordermanmodding.github.io/dispatches \
            -f event_type=mod-updated \
            -f "client_payload[repo]=$REPO" \
            -f "client_payload[ref]=$REF" \
            -f "client_payload[sha]=$SHA"
